  h1{

  }

  .icons a{

    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: 50%;
    color: var(--on-surface);
    transition: background .2s ease, color .2s ease, transform .2s ease;
  }
  .icons a svg{ width:19px; height:19px; }
  .icons a:hover{
    background: var(--primary);
    color: #fff;
    transform: translateY(-2px);
  }

  .icons a::after{
    content: attr(aria-label);
    position: absolute;
    bottom: 120%;
    left: 50%;
    transform: translateX(-50%) translateY(4px);
    background: var(--surface);
    color: var(--on-surface);
    border: 1px solid var(--outline);
    padding: 5px 11px;
    border-radius: 8px;
    font-size: 0.72rem;
    font-weight: 600;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s ease, transform .15s ease;
    z-index: 5;
  }
  .icons a:hover::after{
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  #viz{

    bottom: 0;
    left: 0;
    width: 100%;
    z-index: 2;
    pointer-events: none;
    display: block;
    filter: blur(1.5px);

  #loader{
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 20px;
    transition: opacity .5s ease, visibility .5s ease;
  }
  #loader.hidden{
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .loader-ring{
    --progress: 0;
    width: 116px; height: 116px;
    border-radius: 50%;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: conic-gradient(var(--primary) calc(var(--progress) * 1%), var(--outline) 0%);
    transition: background .35s ease;
    animation: popIn .5s cubic-bezier(.34,1.56,.64,1) both,
               ringPulse 1.8s ease-in-out .5s infinite alternate;
  }
  .loader-avatar{
    width: 100%; height: 100%;
    margin: 0;
    border: 4px solid var(--bg);
    filter: grayscale(calc(100% - var(--progress, 0) * 1%));
    transition: filter .35s ease;
  }
  .loader-name{
    font-family: 'Google Sans Flex', sans-serif;
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--on-surface);
    animation: popIn .5s cubic-bezier(.34,1.56,.64,1) .1s both;
  }
  .loader-quote{
    color: var(--on-surface-dim);
    font-size: 0.85rem;
    text-align: center;
    animation: popIn .5s cubic-bezier(.34,1.56,.64,1) .2s both;
  }

  @keyframes popIn{
    from{ opacity: 0; transform: scale(.8); }
    to{ opacity: 1; transform: scale(1); }
  }
  @keyframes ringPulse{
    from{ transform: scale(1); }
    to{ transform: scale(1.035); }
  }
  @media (prefers-reduced-motion: reduce){
    .loader-ring, .loader-name, .loader-quote{ animation: none; }
  }

  :focus-visible{ outline: 2px solid var(--primary); outline-offset: 3px; }

  @media (max-width: 420px){
    .row{ flex-direction: column; gap: 2px; }
    .row .v{ text-align: left; }
  }

<script>
(function(){
  var canvas = document.getElementById('net');
  var ctx = canvas.getContext('2d');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w, h, particles;
  var mouse = { x: null, y: null, active: false };

  var LINE_COLOR = '169, 136, 120';
  var MOUSE_LINE_COLOR = '232, 92, 74';
  var MAX_DIST = 130;
  var MOUSE_DIST = 240;

  function size(){
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function makeParticles(){
    var count = Math.round((w * h) / 16000);
    count = Math.max(40, Math.min(count, 110));
    particles = [];
    for (var i = 0; i < count; i++){
      particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.35,
        vy: (Math.random() - 0.5) * 0.35,
        r: Math.random() * 1.4 + 0.8
      });
    }
  }

  function step(){
    ctx.clearRect(0, 0, w, h);

    for (var i = 0; i < particles.length; i++){
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + LINE_COLOR + ', 0.55)';
      ctx.fill();

      for (var j = i + 1; j < particles.length; j++){
        var q = particles[j];
        var dx = p.x - q.x, dy = p.y - q.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < MAX_DIST){
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.strokeStyle = 'rgba(' + LINE_COLOR + ', ' + (1 - dist / MAX_DIST) * 0.35 + ')';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }

      if (mouse.active){
        var mdx = p.x - mouse.x, mdy = p.y - mouse.y;
        var mdist = Math.sqrt(mdx * mdx + mdy * mdy);
        if (mdist < MOUSE_DIST){
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(mouse.x, mouse.y);
          ctx.strokeStyle = 'rgba(' + MOUSE_LINE_COLOR + ', ' + (1 - mdist / MOUSE_DIST) * 0.9 + ')';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }
    }

    if (mouse.active){
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + MOUSE_LINE_COLOR + ', 1)';
      ctx.fill();
    }

    if (!reduceMotion) requestAnimationFrame(step);
  }

  window.addEventListener('resize', function(){
    size();
    makeParticles();
    if (reduceMotion) step();
  });

  window.addEventListener('mousemove', function(e){
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  });
  window.addEventListener('mouseleave', function(){
    mouse.active = false;
  });
  window.addEventListener('touchmove', function(e){
    if (e.touches && e.touches[0]){
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
      mouse.active = true;
    }
  }, { passive: true });
  window.addEventListener('touchend', function(){
    mouse.active = false;
  });

  // --- loading screen ---
  var loader = document.getElementById('loader');
  var loaderRing = document.getElementById('loaderRing');
  var loadTasks = { image: false, audio: false, fonts: false };

  function updateLoadProgress(){
    var done = 0;
    for (var key in loadTasks) if (loadTasks[key]) done++;
    var pct = (done / 3) * 100;
    loaderRing.style.setProperty('--progress', pct);
    if (done >= 3) hideLoader();
  }

  function hideLoader(){
    setTimeout(function(){
      loader.classList.add('hidden');
    }, 250);
  }

  var loaderAvatarImg = document.querySelector('.loader-avatar');
  if (loaderAvatarImg.complete){
    loadTasks.image = true;
  } else {
    loaderAvatarImg.addEventListener('load', function(){ loadTasks.image = true; updateLoadProgress(); });
    loaderAvatarImg.addEventListener('error', function(){ loadTasks.image = true; updateLoadProgress(); });
  }

  var loaderAudio = document.getElementById('bgm');
  loaderAudio.addEventListener('canplaythrough', function(){ loadTasks.audio = true; updateLoadProgress(); }, { once: true });
  loaderAudio.addEventListener('error', function(){ loadTasks.audio = true; updateLoadProgress(); }, { once: true });

  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){ loadTasks.fonts = true; updateLoadProgress(); });
  } else {
    loadTasks.fonts = true;
  }

  // safety net: never let the loader hang forever if something fails to fire
  setTimeout(function(){
    loadTasks.image = true;
    loadTasks.audio = true;
    loadTasks.fonts = true;
    updateLoadProgress();
  }, 6000);

  updateLoadProgress();
  // --- end loading screen ---

  size();
  makeParticles();
  step();

  var bgm = document.getElementById('bgm');
  var toggle = document.getElementById('soundToggle');
  var FIXED_VOLUME = 0.85; // 0.0–1.0 — change this one number to adjust

  // --- visualizer setup (Web Audio API) ---
  var vizCanvas = document.getElementById('viz');
  var vizCtx = vizCanvas.getContext('2d');
  var audioCtx, analyser, freqData, vizReady = false;
  var vizHeight = 70;

  function sizeViz(){
    vizHeight = Math.min(120, Math.round(window.innerHeight * 0.12)); // small strip, capped
    vizCanvas.width = window.innerWidth * dpr;
    vizCanvas.height = vizHeight * dpr;
    vizCanvas.style.width = window.innerWidth + 'px';
    vizCanvas.style.height = vizHeight + 'px';
    vizCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  sizeViz();
  window.addEventListener('resize', sizeViz);

  function setupVisualizer(){
    if (vizReady) return;
    vizReady = true;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var source = audioCtx.createMediaElementSource(bgm);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.6;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
    drawViz();
  }

  function drawViz(){
    requestAnimationFrame(drawViz);
    if (!analyser) return;
    analyser.getByteFrequencyData(freqData);

    var vw = window.innerWidth;
    var h = vizHeight;
    vizCtx.clearRect(0, 0, vw, h);

    var n = freqData.length;
    var smoothWindow = 2;
    var smoothed = new Array(n);
    for (var i = 0; i < n; i++){
      var sum = 0, count = 0;
      for (var j = -smoothWindow; j <= smoothWindow; j++){
        var idx = Math.max(0, Math.min(n - 1, i + j));
        sum += freqData[idx];
        count++;
      }
      smoothed[i] = sum / count;
    }

    var SENSITIVITY = 1.0; // 1.0 = raw signal, higher = more reactive to quiet audio
    vizCtx.beginPath();
    vizCtx.moveTo(0, h);
    for (var i = 0; i < n; i++){
      var x = i * vw / (n - 1);
      var value = Math.min(1, (smoothed[i] / 255) * SENSITIVITY);
      var y = h - value * h;
      vizCtx.lineTo(x, y);
    }
    vizCtx.lineTo(vw, h);
    vizCtx.closePath();
    vizCtx.fillStyle = 'rgba(232, 92, 74, 0.22)';
    vizCtx.fill();
  }
  // --- end visualizer setup ---

  bgm.volume = FIXED_VOLUME;
  bgm.muted = true;
  bgm.play().catch(function(){ /* ignored — will start on first interaction below */ });

  function unmuteOnFirstInteraction(){
    setupVisualizer();
    bgm.muted = false;
    if (bgm.paused) bgm.play();
    toggle.classList.add('playing');
    window.removeEventListener('pointerdown', unmuteOnFirstInteraction);
    window.removeEventListener('pointermove', unmuteOnFirstInteraction);
    window.removeEventListener('touchstart', unmuteOnFirstInteraction);
    window.removeEventListener('keydown', unmuteOnFirstInteraction);
    window.removeEventListener('scroll', unmuteOnFirstInteraction);
  }
  window.addEventListener('pointerdown', unmuteOnFirstInteraction, { once: true });
  window.addEventListener('pointermove', unmuteOnFirstInteraction, { once: true });
  window.addEventListener('touchstart', unmuteOnFirstInteraction, { once: true, passive: true });
  window.addEventListener('keydown', unmuteOnFirstInteraction, { once: true });
  window.addEventListener('scroll', unmuteOnFirstInteraction, { once: true, passive: true });

  toggle.addEventListener('click', function(e){
    e.stopPropagation();
    setupVisualizer();
    if (bgm.paused || bgm.muted){
      bgm.muted = false;
      bgm.play();
      toggle.classList.add('playing');
    } else {
      bgm.pause();
      toggle.classList.remove('playing');
    }
  });
})();
</script>

</body>
</html>
